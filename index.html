 <!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard LLM - Local com Análise de Arquivos</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 650px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .config-box { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid #ddd; }
        .config-box input { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        #chat-box { height: 380px; border: 1px solid #ddd; border-radius: 4px; padding: 10px; overflow-y: scroll; margin-bottom: 15px; background: #fafafa; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 6px; max-width: 85%; line-height: 1.4; word-break: break-word; }
        .user { background: #d1e7dd; margin-left: auto; text-align: right; }
        .assistant { background: #cfe2ff; margin-right: auto; }
        .file-info { font-size: 0.85em; color: #555; margin-bottom: 5px; font-style: italic; }
        .input-group { display: flex; flex-direction: column; gap: 10px; }
        .input-row { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 20px; background: #0d6efd; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0b5ed7; }
        .file-upload-row { display: flex; align-items: center; gap: 10px; font-size: 0.9em; }
        .top-link { margin: -6px 0 14px; font-size: 0.9em; }
        .top-link a { color: #0d6efd; font-weight: 600; text-decoration: none; }
        .top-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>Painel LLM Local (Com Arquivos)</h2>
    <p class="top-link"><a href="openchat.html">Abrir OpenChat →</a></p>
    
    <div class="config-box">
        <label for="token"><strong>Token da API:</strong></label>
        <input type="password" id="token" value="1533484f10d532fff376ad51f296f43c" placeholder="Cole seu token Bearer aqui">
    </div>

    <div id="chat-box"></div>

    <div class="input-group">
        <div class="file-upload-row">
            <label for="file-input">📎 Anexar arquivo (.txt, .js, .json, .log):</label>
            <input type="file" id="file-input" accept=".txt,.json,.js,.py,.md,.log,.csv">
        </div>
        <div class="input-row">
            <input type="text" id="user-input" placeholder="Digite sua mensagem ou instrução sobre o arquivo..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>
</div>

<script>
    const API_URL = "https://api.projetosdinamicos.com.br/llm/v1/chat/completions";

    async function sendMessage() {
        const inputField = document.getElementById('user-input');
        const fileInput = document.getElementById('file-input');
        const token = document.getElementById('token').value;
        const text = inputField.value.trim();
        const file = fileInput.files[0];

        if (!text && !file) return;

        let fullContent = text;
        let displayMessage = text;

        // Se houver um arquivo anexado, ler o conteúdo e juntar ao prompt
        if (file) {
            try {
                const fileContent = await readFileAsText(file);
                displayMessage = `${text ? text + '<br>' : ''}<span class="file-info">📄 Arquivo anexado: ${file.name}</span>`;
                fullContent = `${text}\n\n[Conteúdo do arquivo ${file.name}]:\n${fileContent}`;
            } catch (err) {
                alert("Erro ao ler o arquivo.");
                console.error(err);
                return;
            }
        }

        // Exibir mensagem do usuário no chat
        appendMessage('Você', displayMessage, 'user');
        inputField.value = '';
        fileInput.value = ''; // Limpar input de arquivo após envio

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({
                    model: "LFM2.5-230M-Q4_K_M.llamafile",
                    messages: [{ role: "user", content: fullContent }]
                })
            });

            const data = await response.json();

            if (data.choices && data.choices.length > 0) {
                const reply = data.choices[0].message.content;
                appendMessage('IA', reply, 'assistant');
            } else {
                appendMessage('Erro', data.error || 'Resposta inválida do servidor', 'assistant');
            }
        } catch (error) {
            appendMessage('Erro', 'Falha ao comunicar com a API.', 'assistant');
            console.error(error);
        }
    }

    function readFileAsText(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => resolve(e.target.result);
            reader.onerror = (e) => reject(e);
            reader.readAsText(file);
        });
    }

    function appendMessage(sender, htmlContent, className) {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.innerHTML = `<strong>${sender}:</strong><br>${htmlContent}`;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') sendMessage();
    }
</script>

</body>
</html>

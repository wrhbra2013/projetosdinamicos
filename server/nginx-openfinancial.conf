# OpenFinancial — API pública
# Instale em /etc/nginx/sites-available/openfinancial e crie o link em sites-enabled.
# Ajuste os caminhos e o certificado antes de recarregar o nginx.

upstream openfinancial_api {
    server 127.0.0.1:8096;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.projetosdinamicos.com.br;

    # Deixe apenas o desafio do certbot em HTTP; o resto vai para HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.projetosdinamicos.com.br;

    ssl_certificate     /etc/letsencrypt/live/api.projetosdinamicos.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.projetosdinamicos.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/openfinancial-api.access.log;
    error_log  /var/log/nginx/openfinancial-api.error.log warn;

    # JSON é pequeno; 5a tem ~280 KB. Mantém folga para narrativas.
    client_max_body_size 256k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # A API já envia CORS. O nginx apenas evita duplicar o cabeçalho.
    proxy_hide_header Access-Control-Allow-Origin;

    location = /health {
        proxy_pass http://openfinancial_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
    }

    location /v1/ {
        proxy_pass http://openfinancial_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Narrativa por LLM pode levar alguns segundos.
        proxy_connect_timeout 5s;
        proxy_send_timeout 45s;
        proxy_read_timeout 45s;

        proxy_buffering on;
        proxy_buffers 8 16k;
    }

    location / {
        return 404;
    }
}
